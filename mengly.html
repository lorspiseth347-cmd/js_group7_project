<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-light bg-light shadow sticky-top"
      style="height: auto"
    >
      <div class="container-fluid py-1">
        <a class="navbar-brand fw-bold" href="#"
          ><span class="text-warning py-1 fs-2">CAR.</span> Rent</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav m-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link hover fw-bold active"
                aria-current="page"
                href="#"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link hover fw-bold" href="sopattra.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link hover fw-bold" href="peakdey.html">Service</a>
            </li>
            <li class="nav-item">
              <a class="nav-link hover fw-bold" href="peakdey.html">Contact</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link hover fw-bold dropdown-toggle"
                href="#"
                id="navbarDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Car Type
              </a>
              <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                <li>
                  <a class="dropdown-item" href="carType/Avatar.html">Avatar</a>
                </li>
                <li>
                  <a class="dropdown-item" href="carType/BMW.html">BMW</a>
                </li>
                <li><a class="dropdown-item" href="#">Lambogini</a></li>
              </ul>
            </li>
          </ul>
          <form class="d-flex">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
          </form>
          <a class="text-dark px-1" href="#">
            <i class="bi bi-person-fill-gear fs-4"></i
          ></a>
          <button
            type="button"
            class="btn text-dark border-0"
            data-bs-toggle="offcanvas"
            data-bs-target="#bookingCart"
            aria-controls="bookingCart"
          >
            <i class="bi bi-bag-check-fill fs-4"></i>
          </button>
          <div
            class="offcanvas offcanvas-end booking-cart"
            tabindex="-1"
            id="bookingCart"
            aria-labelledby="bookingCartLabel"
          >
            <!-- Header -->
            <div class="offcanvas-header border-bottom px-4 py-4">
              <div>
                <h4 class="fw-bold mb-1" id="bookingCartLabel">My Bookings</h4>

                <p class="text-secondary mb-0">
                  See what you have already booked
                </p>
              </div>

              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close"
              ></button>
            </div>

            <!-- Cart Body -->
            <div class="offcanvas-body p-4">
              <div id="cartItems">
                <!-- Car Item 1 -->
                <div class="booking-item">
                  <!-- Car Image -->
                  <img src="picture/bmw6.jpg" alt="BMW X7" />

                  <!-- Car Information -->
                  <div class="car-info">
                    <h5 class="fw-bold">BMW X7</h5>

                    <!-- Pick-up and Return Date -->
                    <div class="date-info">
                      <p>
                       
                        <strong>Pick-up:</strong> 15 Nov 2026
                      </p>

                      <p>
                        <i class="bi bi-calendar-return"></i>
                        <strong>Return:</strong> 18 Nov 2026
                      </p>
                    </div>
                  </div>

                  <!-- Delete Button -->
                  <button
                    type="button"
                    class="delete-btn"
                    onclick="removeBooking(this)"
                    aria-label="Remove booking"
                  >
                    <i class="bi bi-trash3"></i>
                  </button>
                </div>
              </div>

              <!-- Empty Cart -->
              <div id="emptyCart" class="empty-cart d-none">
                <i class="bi bi-car-front"></i>

                <h5>No bookings yet!</h5>

                <p class="text-secondary">Your booked cars will appear here.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

<style>
  /* Booking Cart */
  .booking-cart {
    width: 550px !important;
    max-width: 100%;
    border: none;
  }

  /* Booking Item */
  .booking-item {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 15px;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    margin-bottom: 18px;
    transition: 0.3s;
  }

  .booking-item:hover {
    border-color: #ffc107;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
  }

  /* Car Image */
  .booking-item img {
    width: 180px;
    height: 105px;
    object-fit: cover;
    border-radius: 6px;
  }

  /* Car Information */
  .car-info {
    flex: 1;
  }

  .car-info h5 {
    font-size: 19px;
    margin-bottom: 25px;
    color: #252525;
  }

  /* Booking Status */
  .booking-status {
    font-size: 17px;
    font-weight: 700;
    color: #252525;
  }

  .booking-status i {
    color: #198754;
    font-size: 21px;
    margin-right: 4px;
  }

  /* Delete Button */
  .delete-btn {
    width: 40px;
    height: 40px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 7px;
    font-size: 20px;
    color: #555;
    cursor: pointer;
    transition: 0.3s;
  }

  .delete-btn:hover {
    background: #dc3545;
    color: white;
    border-color: #dc3545;
  }

  /* Empty Cart */
  .empty-cart {
    text-align: center;
    padding: 80px 15px;
  }

  .empty-cart i {
    font-size: 65px;
    color: #ccc;
  }

  .empty-cart h5 {
    margin-top: 15px;
    font-weight: bold;
  }

  /* Responsive */
  @media (max-width: 576px) {
    .booking-cart {
      width: 100% !important;
    }

    .booking-item {
      gap: 10px;
      padding: 10px;
    }

    .booking-item img {
      width: 110px;
      height: 85px;
    }

    .car-info h5 {
      font-size: 15px;
      margin-bottom: 15px;
    }

    .booking-status {
      font-size: 14px;
    }

    .delete-btn {
      width: 35px;
      height: 35px;
      font-size: 17px;
    }
  }
  .car-info {
    flex: 1;
  }

  .car-info h5 {
    font-size: 19px;
    margin-bottom: 12px;
    color: #252525;
  }

  .date-info p {
    font-size: 14px;
    color: #555;
    margin-bottom: 7px;
  }

  .date-info i {
    color: #198754;
    margin-right: 5px;
    font-size: 16px;
  }

  .date-info strong {
    color: #222;
  }
</style>
