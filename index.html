<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f4f4;
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .login-container {
        width: 850px;
        max-width: 100%;
        min-height: 480px;
        display: flex;
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
      }

      /* Left Image */
      .login-image {
        width: 50%;
        position: relative;
      }

      .login-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .image-text {
        position: absolute;
        bottom: 30px;
        left: 25px;
        color: white;
        z-index: 1;
      }

      .image-text h2 {
        font-weight: bold;
      }

      /* Right Login Form */
      .login-form {
        width: 50%;
        padding: 45px 35px;
      }

      .login-form h1 {
        color: #f0ad00;
        font-weight: bold;
      }

      .input-group {
        border-bottom: 2px solid #ddd;
        margin-top: 25px;
      }

      .input-group:focus-within {
        border-color: #f0ad00;
      }

      .input-group-text {
        background: transparent;
        border: none;
        color: #999;
      }

      .form-control {
        border: none;
        box-shadow: none !important;
        padding: 12px 5px;
      }

      .login-btn {
        background: #ffc107;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
      }

      .login-btn:hover {
        background: #e0a800;
        transform: translateY(-2px);
      }

      .social-icons i {
        font-size: 22px;
        cursor: pointer;
        transition: 0.3s;
      }

      .social-icons i:hover {
        transform: scale(1.2);
      }

      .extra-links {
        font-size: 13px;
      }

      @media (max-width: 650px) {
        .login-container {
          width: 400px;
        }

        .login-image {
          display: none;
        }

        .login-form {
          width: 100%;
          padding: 35px 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <!-- Left Image Section -->
      <div class="login-image">
        <img
          src="picture/44e32e120638b048b9e4897d77b7fba3.jpg"
          alt="Login Background"
        />

        <div class="image-text">
          <h2>Welcome Back!</h2>
          <p>Login to access your account.</p>
        </div>
      </div>

      <!-- Right Login Section -->
      <div class="login-form">
        <div class="text-center mb-4">
          <h1>Login</h1>
          <p class="text-muted">Welcome! Please enter your details.</p>
        </div>

        <form id="loginForm">
          <!-- Email -->
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-envelope"></i>
            </span>

            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <!-- Password -->
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>

            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              required
            />

            <span class="input-group-text" onclick="togglePassword()">
              <i class="bi bi-eye" id="eyeIcon" style="cursor: pointer"></i>
            </span>
          </div>

          <!-- Remember and Forgot Password -->
          <div class="d-flex justify-content-between mt-3 extra-links">
            <div>
              <input type="checkbox" id="remember" />
              <label for="remember">Remember me</label>
            </div>

            <a href="#" class="text-warning text-decoration-none">
              Forgot password?
            </a>
          </div>

          <!-- Message -->
          <div id="message" class="mt-3"></div>

          <!-- Login Button -->
          <button type="submit" class="login-btn w-100 mt-4">Login</button>
        </form>

        <!-- Register -->
        <p class="text-center mt-3">
          Don't have an account?
          <a
            href="register.html"
            class="text-warning text-decoration-none fw-bold"
          >
            Register
          </a>
        </p>

        <!-- Divider -->
        <div class="d-flex align-items-center mt-3">
          <hr class="flex-grow-1" />

          <span class="mx-2 text-muted" style="font-size: 12px">
            OR REGISTER WITH
          </span>

          <hr class="flex-grow-1" />
        </div>

        <!-- Social Icons -->
        <div class="text-center social-icons mt-3">
          <i class="bi bi-facebook text-primary"></i>

          <i class="bi bi-instagram ms-3" style="color: rgb(194, 7, 38)"></i>

          <i class="bi bi-google ms-3"></i>
        </div>
      </div>
    </div>

    <!-- JavaScript -->

    <script>
      // Set Email and Password
      let correctEmail = "admin@gmail.com";
      let correctPassword = "123456";

      let admincorrectEmail = "admin1@gmail.com";
      let admincorrectPassword = "1234567";

      // Login Authentication
      let loginForm = document.getElementById("loginForm");

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        // Get input values
        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value;

        let message = document.getElementById("message");

        // Normal User Login
        if (email === correctEmail && password === correctPassword) {
          message.innerHTML = `
            <div class="alert alert-success py-2">
                <i class="bi bi-check-circle"></i>
                User login successful!
            </div>
        `;

          localStorage.setItem("isLogin", "true");
          localStorage.setItem("role", "user");

          setTimeout(function () {
            window.location.href = "home.html";
          }, 1000);
        }

        // Admin Login
        else if (
          email === admincorrectEmail &&
          password === admincorrectPassword
        ) {
          message.innerHTML = `
            <div class="alert alert-success py-2">
                <i class="bi bi-check-circle"></i>
                Admin login successful!
            </div>
        `;

          localStorage.setItem("isLogin", "true");
          localStorage.setItem("role", "admin");

          setTimeout(function () {
            window.location.href = "dashboard.html";
          }, 1000);
        }

        // Incorrect Login
        else {
          message.innerHTML = `
            <div class="alert alert-danger py-2">
                <i class="bi bi-exclamation-circle"></i>
                Incorrect email or password!
            </div>
        `;
        }
      });

      // Show / Hide Password
      function togglePassword() {
        let password = document.getElementById("password");
        let eyeIcon = document.getElementById("eyeIcon");

        if (password.type === "password") {
          password.type = "text";
          eyeIcon.classList.replace("bi-eye", "bi-eye-slash");
        } else {
          password.type = "password";
          eyeIcon.classList.replace("bi-eye-slash", "bi-eye");
        }
      }
    </script>
  </body>
</html>
